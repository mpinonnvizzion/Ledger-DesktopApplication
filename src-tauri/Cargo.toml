[package]
name = "ledger-desktop"
version = "0.1.0"
description = "Ledger Desktop — local-first finance application"
authors = ["Nvizzion"]
edition = "2021"

[lib]
name = "ledger_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
